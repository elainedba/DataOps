name: CI/CD Pipeline

on:
  push:
    branches:
      - feature/esteira

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: flake8 app tests

      - name: Testes
        run: pytest
    
      - name: Type check (mypy)
        run: mypy app

      - name: Security check (bandit)
        run: bandit -r app

      - name: Complexity check (radon)
        run: radon cc app -a

      - name: Gerar summary
        run: python -c "from app.pipeline import run_pipeline; run_pipeline('data/sales.csv', 'output/summary.csv')"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: summary-csv
          path: output/summary.csv

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        run: echo "Promovendo artefato para produção"