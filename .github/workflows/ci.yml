name: CI/CD Pipeline

on:
  push:
    branches:
      - feature/esteira

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: flake8 app tests